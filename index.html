<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- No remote scripts, styles or connections: everything the app needs ships with it. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Communication Styles</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CommStyles">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .screen { display: none; flex: 1; flex-direction: column; }
    .screen.active { display: flex; }

    /* Buttons: no double-tap zoom delay (pinch-zoom still works), no Android tap square. */
    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    /* Keyboard focus ring. :focus-visible never matches a tap or click, so touch users
       don't get a box drawn around what they pressed. */
    button:focus-visible {
      outline: 3px solid #a5b4fc;
      outline-offset: 2px;
    }
    /* Headings receive focus on screen change so screen readers announce the new screen;
       they are not interactive, so no ring. */
    [data-screen-focus]:focus { outline: none; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Home Screen */
    .home-screen {
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }
    .title {
      font-size: 28px;
      font-weight: bold;
      color: #f8fafc;
      margin-bottom: 10px;
      text-align: center;
    }
    .subtitle {
      font-size: 16px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 40px;
      padding: 0 20px;
    }
    .btn {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background-color: #6366f1; }
    .btn-secondary { background-color: #334155; }
    .btn-outline {
      background-color: transparent;
      border: 2px solid #334155;
      color: #f8fafc;
      margin-top: 10px;
    }

    /* Assessment Hub Cards */
    .hub-cards {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }
    .hub-card {
      display: block;
      width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .hub-card-icon, .hub-card-title, .hub-card-desc { display: block; }
    .hub-card:hover {
      border-color: #6366f1;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.15);
    }
    .hub-card-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }
    .hub-card-title {
      color: #f8fafc;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .hub-card-desc {
      color: #94a3b8;
      font-size: 14px;
      line-height: 21px;
      margin-bottom: 12px;
    }
    .hub-card-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-available { background-color: #1e3a5f; color: #60a5fa; }
    .badge-coming { background-color: #2d2204; color: #facc15; }
    .hub-card.disabled {
      opacity: 0.5;
      cursor: default;
    }
    .hub-card.disabled:hover {
      border-color: #334155;
      transform: none;
      box-shadow: none;
    }

    /* Quiz Screen */
    .quiz-screen {
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .progress-bar-container {
      width: 100%;
      max-width: 400px;
      height: 8px;
      background-color: #334155;
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background-color: #6366f1;
      transition: width 0.3s ease;
    }
    .legend-text {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 30px;
      background-color: #1e293b;
      padding: 8px 15px;
      border-radius: 8px;
    }
    .progress-text {
      color: #6366f1;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .question-card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
      min-height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
      border: 1px solid #334155;
    }
    .question {
      color: #f8fafc;
      font-size: 20px;
      text-align: center;
      line-height: 28px;
    }
    .options-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      padding: 0 10px;
      -webkit-tap-highlight-color: transparent;
    }
    .circle {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 2px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: inherit;
      font-weight: bold;
      font-size: 18px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .circle:active {
      background-color: #6366f1;
      border-color: #6366f1;
      transform: scale(1.1);
    }
    .circle.selected {
      background-color: #6366f1;
      border-color: #6366f1;
      transform: scale(1.1);
    }

    /* Quiz Navigation */
    .quiz-top-row {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }
    .cancel-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 8px;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .cancel-btn:hover { color: #f87171; }
    .quiz-nav-row {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      position: relative;
      min-height: 32px;
    }
    .nav-btn {
      background: none;
      border: 1px solid #475569;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 16px;
      border-radius: 8px;
      transition: all 0.2s;
      position: absolute;
    }
    .nav-btn:hover { color: #f8fafc; border-color: #6366f1; }
    .nav-btn.prev { left: 0; }
    .nav-btn.next { right: 0; }

    /* Results Screen */
    .results-screen {
      padding: 20px;
      align-items: center;
      overflow-y: auto;
    }
    .primary-card {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 15px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 15px;
      border: 1px solid #6366f1;
    }
    .primary-title {
      color: #f8fafc;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .primary-desc {
      color: #cbd5e1;
      font-size: 16px;
      line-height: 24px;
      margin-bottom: 15px;
    }
    .bullet-item {
      color: #e0e7ff;
      font-size: 15px;
      line-height: 22px;
      margin-bottom: 8px;
      padding-left: 10px;
    }
    .link-button {
      background-color: #4f46e5;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-top: 10px;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      border: none;
      width: 100%;
      transition: opacity 0.2s;
    }
    .link-button:hover { opacity: 0.85; }
    .secondary-card {
      background-color: #0f172a;
      padding: 20px;
      border-radius: 15px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 20px;
      border: 1px solid #475569;
    }
    .secondary-title {
      color: #f8fafc;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .secondary-desc {
      color: #94a3b8;
      font-size: 15px;
      line-height: 22px;
      margin-bottom: 15px;
    }
    .bullet-item-secondary {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 20px;
      margin-bottom: 6px;
      padding-left: 10px;
    }
    .score-board {
      width: 100%;
      max-width: 500px;
      background-color: #1e293b;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
    }
    .score-row:last-child { border-bottom: none; }
    .score-label { color: #f8fafc; font-size: 16px; font-weight: 500; }
    .score-value { color: #94a3b8; font-size: 16px; font-weight: bold; }

    /* Growth plan: green for the strength you have, amber for the stretch to practice. */
    .growth { width: 100%; max-width: 500px; margin-bottom: 20px; }
    .growth-heading { color: #f8fafc; font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .growth-intro { color: #94a3b8; font-size: 14px; line-height: 20px; margin-bottom: 12px; }
    .growth-card {
      background-color: #1e293b;
      padding: 18px 20px;
      border-radius: 15px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .growth-strength { border-color: #34d399; }
    .growth-stretch { border-color: #fbbf24; }
    .growth-label {
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .growth-strength .growth-label { color: #34d399; }
    .growth-stretch .growth-label { color: #fbbf24; }
    .growth-title { color: #f8fafc; font-size: 19px; font-weight: bold; margin-bottom: 8px; }
    .growth-text { color: #cbd5e1; font-size: 15px; line-height: 22px; margin-bottom: 8px; }
    .growth-text strong { color: #f8fafc; }
    .growth-note { color: #fde68a; font-size: 14px; line-height: 20px; margin-bottom: 8px; }
    .growth-sub { color: #f8fafc; font-size: 15px; font-weight: bold; margin: 12px 0 8px; }
    .practice-list { list-style: none; }
    .practice-item {
      background-color: #0f172a;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .practice-item:last-child { margin-bottom: 0; }
    .practice-text { display: block; color: #e2e8f0; font-size: 15px; line-height: 22px; }
    .practice-source { display: block; color: #94a3b8; font-size: 12px; margin-top: 4px; }

    /* History Screen */
    .history-screen {
      padding: 20px;
      align-items: center;
      overflow-y: auto;
    }
    .history-toolbar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 15px;
    }
    .toolbar-btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .toolbar-btn:hover { opacity: 0.85; }
    .btn-danger { background-color: #ef4444; color: white; }
    .btn-danger-outline { background-color: transparent; border: 2px solid #ef4444; color: #ef4444; }
    .history-tiles {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .history-tile {
      background-color: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      transition: all 0.15s;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }
    /* The tile's content is one button (open / toggle selection); the checkbox is a
       sibling button, never nested inside it. */
    .tile-main {
      display: block;
      width: 100%;
      padding: 16px 16px 16px 44px;
      background: none;
      border: none;
      border-radius: 12px;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      -webkit-touch-callout: none;
    }
    .tile-primary, .tile-overall { display: block; }
    .tile-overall {
      color: #a78bfa;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .history-tile:hover { border-color: #6366f1; }
    .history-tile.tile-selected {
      border-color: #6366f1;
      background-color: #1e2d4a;
    }
    .tile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .tile-date { color: #94a3b8; font-size: 13px; }
    .tile-attempt { color: #6366f1; font-size: 13px; font-weight: 600; }
    .tile-primary {
      color: #f8fafc;
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .tile-scores {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tile-score-chip {
      background-color: #0f172a;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #94a3b8;
    }
    .tile-checkbox {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 2px solid #475569;
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font: inherit;
      opacity: 0.5;
      transition: opacity 0.15s;
      cursor: pointer;
      z-index: 2;
    }
    .tile-checkbox:focus-visible { opacity: 1; }
    .tile-checkbox:hover {
      opacity: 1;
      border-color: #6366f1;
    }
    .tile-checkbox.checked {
      background-color: #6366f1;
      border-color: #6366f1;
      opacity: 1;
    }
    .tile-checkbox.checked::after {
      content: '\2713';
      color: white;
      font-size: 14px;
      font-weight: bold;
    }
    .history-tile.tile-selected .tile-checkbox {
      opacity: 1;
    }
    /* When in select mode, always show checkboxes fully */
    .history-tiles.select-mode .tile-checkbox {
      opacity: 1;
    }
    .history-empty {
      color: #64748b;
      font-size: 16px;
      text-align: center;
      margin-top: 40px;
    }

    /* Context Menu */
    .context-menu {
      position: fixed;
      background-color: #1e293b;
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 6px 0;
      min-width: 160px;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      display: none;
    }
    .context-menu.visible { display: block; }
    .context-menu-item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      font: inherit;
      padding: 10px 18px;
      color: #f8fafc;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.1s;
    }
    .context-menu-item:hover { background-color: #334155; }
    .context-menu-item:focus-visible { outline-offset: -3px; }
    .context-menu-item.danger { color: #f87171; }
    .context-menu-item.danger:hover { background-color: #3b1a1a; }

    /* Back-button exit toast */
    .back-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #334155;
      color: #f8fafc;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .back-toast.visible {
      opacity: 1;
    }

    /* Undo toast: shown after a delete or a discarded assessment. */
    .undo-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 32px);
      background-color: #334155;
      color: #f8fafc;
      padding: 8px 8px 8px 20px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 2000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .undo-toast[hidden] { display: none; }
    .undo-btn {
      background: none;
      border: none;
      color: #a5b4fc;
      font: inherit;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 16px;
      cursor: pointer;
    }
    .undo-btn:hover { background-color: rgba(255,255,255,0.08); }
  </style>
</head>
<body>

  <!-- Home Screen -->
  <div id="home-screen" class="screen home-screen active">
    <h1 class="title" style="margin-top:40px;" tabindex="-1" data-screen-focus>Communication Styles</h1>
    <p class="subtitle">Explore how you communicate, collaborate, and navigate relationships.</p>
    <div class="hub-cards">
      <button type="button" class="hub-card" onclick="openAssessment('conflict')">
        <span class="hub-card-icon" aria-hidden="true">&#9878;</span>
        <span class="hub-card-title">Conflict Style Assessment</span>
        <span class="hub-card-desc">Discover how you naturally handle disagreements — avoiding, dominating, compromising, obliging, or integrating.</span>
        <span class="hub-card-badge badge-available">25 Questions</span>
      </button>
      <button type="button" class="hub-card" onclick="openAssessment('listening')">
        <span class="hub-card-icon" aria-hidden="true">&#128483;</span>
        <span class="hub-card-title">Listening Style Profile</span>
        <span class="hub-card-desc">Understand whether you listen to connect, analyze, act, or manage time — and how it shapes your conversations.</span>
        <span class="hub-card-badge badge-available">20 Questions</span>
      </button>
      <button type="button" class="hub-card" onclick="openAssessment('feedback')">
        <span class="hub-card-icon" aria-hidden="true">&#129309;</span>
        <span class="hub-card-title">Feedback Style Inventory</span>
        <span class="hub-card-desc">Learn how you give and receive feedback — direct, supportive, analytical, or reflective.</span>
        <span class="hub-card-badge badge-available">20 Questions</span>
      </button>
      <button type="button" class="hub-card" onclick="openAssessment('communication')">
        <span class="hub-card-icon" aria-hidden="true">&#128172;</span>
        <span class="hub-card-title">Communication Style</span>
        <span class="hub-card-desc">Discover your natural communication approach — driving, expressing, supporting, or analyzing.</span>
        <span class="hub-card-badge badge-available">20 Questions</span>
      </button>
      <button type="button" class="hub-card" onclick="openAssessment('ei')">
        <span class="hub-card-icon" aria-hidden="true">&#129504;</span>
        <span class="hub-card-title">Emotional Intelligence</span>
        <span class="hub-card-desc">Measure your ability to perceive, manage, and harness emotions — in yourself and others.</span>
        <span class="hub-card-badge badge-available">20 Questions</span>
      </button>
    </div>
  </div>

  <!-- Assessment Landing -->
  <div id="assessment-home-screen" class="screen home-screen">
    <h1 class="title" id="assessment-title" style="margin-top:40px;" tabindex="-1" data-screen-focus></h1>
    <p class="subtitle" id="assessment-subtitle"></p>
    <button class="btn btn-primary" onclick="startQuiz()">Start New Assessment</button>
    <button class="btn btn-secondary" id="view-past-btn" style="display:none;" onclick="viewPastResults()">View Past Results</button>
    <button class="btn btn-outline" onclick="showScreen('home')" style="max-width:400px;">&#8592; Back to Hub</button>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" class="screen quiz-screen">
    <div class="quiz-top-row">
      <button class="cancel-btn" onclick="cancelQuiz()">&#x2715; Cancel</button>
      <div class="progress-bar-container" style="margin-bottom:0; flex:1; margin-left:10px;">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
    <div class="legend-text">1: Never | 2: Seldom | 3: Sometimes | 4: Often | 5: Always</div>
    <div class="quiz-nav-row">
      <button class="nav-btn prev" id="prev-btn" onclick="goBack()" style="display:none;">&#8592; Previous</button>
      <div class="progress-text" id="progress-text"></div>
      <button class="nav-btn next" id="next-btn" onclick="goNext()" style="display:none;">Next &#8594;</button>
    </div>
    <div class="question-card" aria-live="polite">
      <div class="question" id="question-text" tabindex="-1" data-screen-focus></div>
    </div>
    <div class="options-container" role="group" aria-label="Your answer, from 1 (never) to 5 (always)">
      <button type="button" class="circle" id="circle-1" aria-label="1, Never" aria-pressed="false" onclick="handleSelect(1)">1</button>

          ]
        },
        Analytical: {
          strength: "You are precise, well prepared and careful with facts.",
          watchOut: "You may come across as reserved or slow to decide.",
          useWhen: "accuracy matters, a decision is complex, or a plan needs stress-testing.",
          practices: [
            { text: "Back your key point with one strong piece of evidence. Strong arguments are the ones that change minds for good.", source: "Petty & Cacioppo, 1986" },
            { text: "Put complex details in writing after a conversation, and save live talk for questions and decisions.", source: "Daft & Lengel, 1986" }
          ]
        }
      },
      ei: {
        'Self-Awareness': {
          strength: "You know what you feel and what sets you off, so you can choose how to respond.",
          watchOut: "Feelings can catch you by surprise or leak into conversations without you noticing.",
          useWhen: "you're heading into a hard conversation, feeling stressed, or making a big decision.",
          practices: [
            { text: "Name the feeling as precisely as you can (\"frustrated\" rather than \"bad\"). Labeling emotions calms the brain's alarm system.", source: "Lieberman et al., 2007" },
            { text: "Spend 15 minutes writing about something that's weighing on you.", source: "Pennebaker, 1997" }
          ]
        },
        'Self-Management': {
          strength: "You stay steady under pressure and think before you react.",
          watchOut: "Strong emotions can decide what you say before you do.",
          useWhen: "conflict heats up, plans fall apart, or you're tired and stressed.",
          practices: [
            { text: "\"Go to the balcony\": pause, breathe and step back before you respond.", source: "Ury, 1993" },
            { text: "When you notice a strong reaction, name it to yourself (\"I'm feeling defensive\"). Naming it takes some of the heat out.", source: "Lieberman et al., 2007" }
          ]
        },
        'Social Awareness': {
          strength: "You read the room and pick up on what people feel but don't say.",
          watchOut: "You may miss subtle cues or misread how someone is feeling.",
          useWhen: "someone goes quiet, tension is unspoken, or backgrounds and cultures differ.",
          practices: [
            { text: "Watch for the three signs of rapport (attention, warmth and being in sync) and notice when they drop.", source: "Tickle-Degnen & Rosenthal, 1990" },
            { text: "With people from other backgrounds, slow down and treat your first read as a guess to check.", source: "Gudykunst, 1995" }
          ]
        },
        'Relationship Management': {
          strength: "You handle conflict well, motivate others and give feedback that lands.",
          watchOut: "Hard conversations may turn defensive, or your encouragement may not reach people.",
          useWhen: "you're giving feedback, resolving a conflict or supporting someone who's discouraged.",
          practices: [
            { text: "Swap criticism for a specific request: \"Could you…\" instead of \"You always…\"", source: "Gottman & Levenson, 1992" },
            { text: "Respond to other people's good news with real interest and a question.", source: "Gable et al., 2006" },
            { text: "Keep positive moments well ahead of negative ones. Stable couples run about five to one, even in conflict.", source: "Gottman & Levenson, 1999" }
          ]
        }
      }
    };

    // ===== State =====
    let currentAssessment = null;
    let currentIdx = 0;
    let answers = [];
    let maxAnswered = -1;
    let resultHistory = [];
    let selectedTiles = new Set();
    let cameFromHistory = false;
    let viewingAssessmentKey = null;

    function getConfig() { return assessments[currentAssessment]; }

    function getActiveScreen() {
      var el = document.querySelector('.screen.active');
      return el ? el.id.replace('-screen', '') : 'home';
    }

    // Screen changes never touch browser history (see "Back button" below). They move focus to
    // the new screen's heading so keyboard and screen-reader users land at the top of it.
    function showScreen(name) {
      cancelPendingExit();
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
      var screen = document.getElementById(name + '-screen');
      screen.classList.add('active');
      var focusTarget = screen.querySelector('[data-screen-focus]');
      if (focusTarget) focusTarget.focus();
    }

    // Everything that goes into innerHTML from saved data is escaped: stored results are
    // user-modifiable, and markup built from them must not be able to run script.
    function esc(value) {
      return String(value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function announce(message) {
      var region = document.getElementById('sr-status');
      region.textContent = '';
      setTimeout(function () { region.textContent = message; }, 50);
    }

    // Whether the most recent input was the keyboard. Focus is only restored after a re-render
    // for keyboard users; moving it for a mouse or touch user could scroll the page under them.
    var lastInputWasKeyboard = false;
    document.addEventListener('keydown', function () { lastInputWasKeyboard = true; }, true);
    document.addEventListener('pointerdown', function () { lastInputWasKeyboard = false; }, true);

    // ===== Scoring =====
    // Which style a question counts toward. finishQuiz and the per-style maximums both use this,
    // so the "x / max" shown on the results can never disagree with how the score was added up.
    function styleIndexForQuestion(config, i) {
      if (config.customScoring === 'ei') {
        // EI questions come in consecutive blocks, one block per area.
        return Math.floor(i / (config.questions.length / config.styles.length));
      }
      return i % config.styles.length;
    }

    function maxScoresByStyle(config) {
      var max = {};
      config.styles.forEach(function (s) { max[s] = 0; });
      config.questions.forEach(function (_, i) { max[config.styles[styleIndexForQuestion(config, i)]] += 5; });
      return max;
    }

    function maxOverallScore(config) { return config.questions.length * 5; }

    // ===== Storage =====
    function isValidResult(r) {
      return !!r && typeof r === 'object' && !!r.scores && typeof r.scores === 'object' && Array.isArray(r.primaries);
    }

    // A saved value that isn't a list (or has malformed entries) is treated as no history rather
    // than crashing the assessment.
    function readStoredResults(key) {
      try {
        var parsed = JSON.parse(localStorage.getItem(key) || '[]');
        return Array.isArray(parsed) ? parsed.filter(isValidResult) : [];
      } catch (e) {
        return [];
      }
    }

    function loadHistory() {
      var config = getConfig();
      resultHistory = readStoredResults(config.storageKey);
      // Migrate the old single-result conflict format.
      if (currentAssessment === 'conflict') {
        try {
          var old = JSON.parse(localStorage.getItem('conflict_scores') || 'null');
          if (isValidResult(old)) {
            resultHistory.unshift(old);
            saveHistory();
            localStorage.removeItem('conflict_scores');
          }
        } catch (e) { /* unreadable old record: leave it where it is */ }
      }
      updateHomeBtn();
    }

    function saveHistory() {
      try {
        localStorage.setItem(getConfig().storageKey, JSON.stringify(resultHistory));
      } catch (e) { console.log("Failed to save data."); }
    }

    function addResult(result) {
      resultHistory.unshift(result);
      saveHistory();
    }

    // Results store when they were taken as a timestamp and format it only for display, so the
    // date follows the device's current language. Older results saved the display text itself;
    // that is shown as it was stored.
    function formatResultDate(r) {
      if (typeof r.timestamp === 'number' && isFinite(r.timestamp)) return new Date(r.timestamp).toLocaleDateString();
      return typeof r.date === 'string' ? r.date : '';
    }

    function updateHomeBtn() {
      const btn = document.getElementById('view-past-btn');
      if (resultHistory.length > 0) {
        btn.style.display = 'block';
        btn.textContent = 'View Past Results (' + resultHistory.length + ')';
      } else {
        btn.style.display = 'none';
      }
    }

    // ===== Undo =====
    // Deleting results and discarding an assessment in progress both happen immediately, with an
    // Undo toast. The toast stays while it is hovered or focused, and Ctrl+Z also undoes.
    var UNDO_MS = 8000;
    var pendingUndo = null; // { restore, timer }

    function offerUndo(message, restore) {
      dismissUndo();
      pendingUndo = { restore: restore, timer: null };
      document.getElementById('undo-message').textContent = message;
      document.getElementById('undo-toast').hidden = false;
      announce(message + '. Undo is available.');
      startUndoTimer();
    }

    function startUndoTimer() {
      if (!pendingUndo) return;
      clearTimeout(pendingUndo.timer);
      pendingUndo.timer = setTimeout(dismissUndo, UNDO_MS);
    }

    function pauseUndoTimer() {
      if (pendingUndo) clearTimeout(pendingUndo.timer);
    }

    function dismissUndo() {
      if (!pendingUndo) return;
      clearTimeout(pendingUndo.timer);
      pendingUndo = null;
      document.getElementById('undo-toast').hidden = true;
    }

    function runUndo() {
      if (!pendingUndo) return;
      var restore = pendingUndo.restore;
      dismissUndo();
      restore();
    }

    (function () {
      var toast = document.getElementById('undo-toast');
      toast.addEventListener('mouseenter', pauseUndoTimer);
      toast.addEventListener('mouseleave', startUndoTimer);
      toast.addEventListener('focusin', pauseUndoTimer);
      toast.addEventListener('focusout', startUndoTimer);
    })();

    // ===== Assessment Landing =====
    function openAssessment(key) {
      dismissUndo();
      currentAssessment = key;
      const config = getConfig();
      document.getElementById('assessment-title').textContent = config.title;
      document.getElementById('assessment-subtitle').textContent = config.subtitle;
      loadHistory();
      showScreen('assessment-home');
    }

    function backToAssessmentHome() {
      loadHistory();
      showScreen('assessment-home');
    }

    // ===== Quiz =====
    function startQuiz() {
      dismissUndo();
      const config = getConfig();
      currentIdx = 0;
      answers = new Array(config.questions.length).fill(null);
      maxAnswered = -1;
      updateQuizUI();
      showScreen('quiz');
    }

    function updateQuizUI() {
      const config = getConfig();
      const total = config.questions.length;
      document.getElementById('progress-bar').style.width = ((maxAnswered + 1) / total * 100) + '%';
      document.getElementById('progress-text').textContent = 'Question ' + (currentIdx + 1) + ' of ' + total;
      document.getElementById('question-text').textContent = config.questions[currentIdx];
      document.getElementById('prev-btn').style.display = currentIdx > 0 ? 'block' : 'none';
      var canGoNext = answers[currentIdx] !== null && currentIdx < total - 1 && currentIdx <= maxAnswered;
      document.getElementById('next-btn').style.display = canGoNext ? 'block' : 'none';
      for (var i = 1; i <= 5; i++) {
        var el = document.getElementById('circle-' + i);
        var on = answers[currentIdx] === i;
        el.classList.toggle('selected', on);
        el.setAttribute('aria-pressed', on ? 'true' : 'false');
      }
    }

    function handleSelect(value) {
      answers[currentIdx] = value;
      if (currentIdx > maxAnswered) maxAnswered = currentIdx;
      var total = getConfig().questions.length;
      if (currentIdx < total - 1) {
        currentIdx++;
        updateQuizUI();
      } else {
        finishQuiz();
      }
    }

    function goBack() {
      if (currentIdx > 0) { currentIdx--; updateQuizUI(); }
    }

    function goNext() {
      var total = getConfig().questions.length;
      if (answers[currentIdx] !== null && currentIdx < total - 1) {
        currentIdx++;
        updateQuizUI();
      }
    }

    // Leaves the quiz straight away (Cancel, Escape, or the back button). If any question was
    // answered, the answers are kept aside and the toast offers to resume where the user left off.
    function cancelQuiz() {
      var answered = answers.some(function (a) { return a !== null; });
      var saved = answered
        ? { key: currentAssessment, idx: currentIdx, answers: answers.slice(), maxAnswered: maxAnswered }
        : null;
      currentIdx = 0;
      answers = [];
      maxAnswered = -1;
      loadHistory();
      showScreen('assessment-home');
      if (saved) {
        offerUndo('Assessment discarded', function () { resumeQuiz(saved); });
      }
    }

    function resumeQuiz(saved) {
      currentAssessment = saved.key;
      currentIdx = saved.idx;
      answers = saved.answers;
      maxAnswered = saved.maxAnswered;
      updateQuizUI();
      showScreen('quiz');
      announce('Assessment restored at question ' + (currentIdx + 1) + '.');
    }

    function finishQuiz() {
      var config = getConfig();
      var scores = {};
      config.styles.forEach(function(s) { scores[s] = 0; });

      // EI reverse-scores some items; the other assessments have none.
      var reverseSet = {};
      (config.reverseItems || []).forEach(function(idx) { reverseSet[idx] = true; });
      answers.forEach(function(val, i) {
        if (val === null) return;
        var scored = reverseSet[i] ? (6 - val) : val;
        scores[config.styles[styleIndexForQuestion(config, i)]] += scored;
      });

      var maxScore = Math.max.apply(null, Object.values(scores));
      var primaries = Object.keys(scores).filter(function(k) { return scores[k] === maxScore; });
      var secondaries = Object.keys(scores).filter(function(k) { return scores[k] >= maxScore - 3 && scores[k] < maxScore; });
      var result = { scores: scores, primaries: primaries, secondaries: secondaries, timestamp: Date.now(), assessment: currentAssessment };

      // Store overall total for EI
      if (config.customScoring === 'ei') {
        var total = 0;
        Object.values(scores).forEach(function(v) { total += v; });
        result.overallScore = total;
      }

      addResult(result);
      cameFromHistory = false;
      showResults(result);
    }

    // ===== Results =====
    function describe(config, style) {
      return esc(config.descriptions[style] || '');
    }

    // "Your Growth Plan": the strength (and, for styles, the watch-out) of the top style, then the
    // lowest-scoring style or EI area with practices for building it. No style is better than
    // another, so for the style assessments the stretch is the one used least — being able to reach
    // for it is the growth. Ties: three or more top styles share one card, at most two stretch
    // cards are shown, and a result where everything ties gets only the "scored evenly" advice.
    function growthPlanHtml(assessmentKey, config, scores, primaries) {
      var plans = growthPlans[assessmentKey];
      if (!plans) return '';
      var isEI = config.customScoring === 'ei';
      var values = config.styles.map(function (s) { return scores[s]; }).filter(function (v) { return typeof v === 'number'; });
      if (!values.length) return '';
      var top = Math.max.apply(null, values);
      var low = Math.min.apply(null, values);
      var stretch = config.styles.filter(function (s) { return scores[s] === low && primaries.indexOf(s) === -1; }).slice(0, 2);

      var html = '<section class="growth" aria-labelledby="growth-heading">';
      html += '<h2 class="growth-heading" id="growth-heading">Your Growth Plan</h2>';
      html += '<p class="growth-intro">A reflection tool, not a diagnosis. Pick one practice and try it this week.</p>';

      if (stretch.length && primaries.length > 2) {
        html += '<div class="growth-card growth-strength">';
        html += '<div class="growth-label">' + (isEI ? 'Strongest areas' : 'Your strengths') + '</div>';
        html += '<div class="growth-title">' + esc(primaries.join(', ')) + '</div>';
        html += '<p class="growth-text">' + (isEI
          ? 'These areas scored equally, a solid base to build on.'
          : 'You use these about equally, so you likely switch between them as situations change.') + '</p>';
        html += '</div>';
      } else if (stretch.length) {
        primaries.forEach(function (p) {
          var plan = plans[p];
          if (!plan) return;
          html += '<div class="growth-card growth-strength">';
          html += '<div class="growth-label">' + (isEI ? 'Strongest area' : 'Your strength') + '</div>';
          html += '<div class="growth-title">' + esc(p) + '</div>';
          html += '<p class="growth-text">' + esc(plan.strength) + '</p>';
          if (!isEI) html += '<p class="growth-text"><strong>Watch out:</strong> ' + esc(plan.watchOut) + '</p>';
          html += '</div>';
        });
      }

      if (!stretch.length) {
        html += '<div class="growth-card growth-stretch">';
        html += '<div class="growth-label">' + (isEI ? 'Focus area' : 'Stretch area') + '</div>';
        html += '<p class="growth-text">' + (isEI
          ? 'Your areas scored evenly. Choose the one that matters most for what you face this week and practice it on purpose.'
          : 'You scored evenly across every style, so you already adapt. Before your next hard conversation, decide which approach the moment needs.') + '</p>';
        html += '</div>';
      }

      stretch.forEach(function (s) {
        var plan = plans[s];
        if (!plan) return;
        html += '<div class="growth-card growth-stretch">';
        html += '<div class="growth-label">' + (isEI ? 'Focus area' : 'Stretch area') + '</div>';
        html += '<div class="growth-title">' + esc(s) + '</div>';
        if (top - low <= 3) html += '<p class="growth-note">Your scores are close together, so this is a gentle stretch rather than a gap.</p>';
        if (isEI) html += '<p class="growth-text"><strong>Signs it needs attention:</strong> ' + esc(plan.watchOut) + '</p>';
        html += '<p class="growth-text"><strong>' + (isEI ? 'It matters most when' : 'Reach for it when') + '</strong> ' + esc(plan.useWhen) + '</p>';
        html += '<div class="growth-sub">Try this week</div>';
        html += '<ul class="practice-list">';
        plan.practices.forEach(function (pr) {
          html += '<li class="practice-item"><span class="practice-text">' + esc(pr.text) + '</span>';
          html += '<span class="practice-source">Research: ' + esc(pr.source) + '</span></li>';
        });
        html += '</ul></div>';
      });

      html += '</section>';
      return html;
    }

    function showResults(result) {
      var assessmentKey = result.assessment || currentAssessment;
      viewingAssessmentKey = assessmentKey;
      var config = assessments[assessmentKey];
      var scores = result.scores;
      var primaries = result.primaries;
      var secondaries = Array.isArray(result.secondaries) ? result.secondaries : [];
      var maxByStyle = maxScoresByStyle(config);
      var fallbackMax = (config.questions.length / config.styles.length) * 5;
      var html = '';

      // EI: Overall score band at the top
      if (config.customScoring === 'ei' && typeof result.overallScore === 'number') {
        var total = result.overallScore;
        var band = null;
        config.overallBands.forEach(function(b) { if (total >= b.min && total <= b.max) band = b; });
        html += '<div class="primary-card" style="border-color:#a78bfa;">';
        html += '<div class="primary-title">' + (band ? band.label : 'EI Score') + ': ' + total + ' / ' + maxOverallScore(config) + '</div>';
        html += '<div class="primary-desc">' + (band ? band.desc : '') + '</div>';
        html += '</div>';
      }

      // Strongest category card
      html += '<div class="primary-card">';
      html += '<div class="primary-title">' + (config.customScoring === 'ei' ? 'Strongest Area' : 'Primary Style') + (primaries.length > 1 ? 's' : '') + ': ' + esc(primaries.join(' & ')) + '</div>';
      if (primaries.length > 1) {
        html += '<div class="primary-desc">' + (config.customScoring === 'ei' ? 'You scored equally in multiple areas, showing well-rounded emotional skills.' : 'You tied for multiple dominant styles. This indicates high adaptability — you likely shift your approach depending on the situation, the stakes involved, or your energy at the moment.') + '</div>';
        primaries.forEach(function(p) {
          html += '<div class="bullet-item">&bull; ' + esc(p) + ': ' + describe(config, p) + '</div>';
        });
      } else {
        html += '<div class="primary-desc">' + describe(config, primaries[0]) + '</div>';
      }
      primaries.forEach(function(p) {
        html += '<button type="button" class="link-button" data-learn-more="' + esc(p) + '">Learn about ' + esc(p) + ' &rarr;</button>';
      });
      html += '</div>';

      if (secondaries.length > 0) {
        html += '<div class="secondary-card">';
        html += '<div class="secondary-title">' + (config.customScoring === 'ei' ? 'Close Behind: ' : 'Close Fallbacks: ') + esc(secondaries.join(', ')) + '</div>';
        html += '<div class="secondary-desc">' + (config.customScoring === 'ei' ? 'These areas scored within 3 points of your strongest. Small, focused effort here can round out your emotional intelligence significantly.' : 'Scoring within 3 points of your dominant style means these are strong secondary strategies. You likely pivot to these naturally when your primary approach hits a wall.') + '</div>';
        secondaries.forEach(function(s) {
          html += '<div class="bullet-item-secondary">&bull; ' + esc(s) + ': ' + describe(config, s) + '</div>';
        });
        html += '</div>';
      }

      html += '<div class="score-board">';
      Object.keys(scores).forEach(function(key) {
        var max = maxByStyle[key] !== undefined ? maxByStyle[key] : fallbackMax;
        html += '<div class="score-row"><span class="score-label">' + esc(key) + '</span><span class="score-value">' + esc(scores[key]) + ' / ' + max + '</span></div>';
      });
      html += '</div>';
      html += growthPlanHtml(assessmentKey, config, scores, primaries);
      html += '<div style="color:#64748b; font-size:12px; text-align:center; margin-bottom:20px; padding:0 20px; line-height:18px;">' + config.reference + '</div>';

      document.getElementById('results-content').innerHTML = html;
      document.getElementById('results-back-btn').textContent = cameFromHistory ? 'Back to Past Results' : 'Return to Home';
      showScreen('results');
    }

    // "Learn about …" buttons carry their style in a data attribute; one delegated listener
    // handles them all, so no saved value is ever spliced into inline script.
    document.getElementById('results-content').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-learn-more]');
      if (btn) openLearnMore(btn.getAttribute('data-learn-more'));
    });

    function resultsGoBack() {
      if (cameFromHistory) {
        cameFromHistory = false;
        viewPastResults();
      } else {
        backToAssessmentHome();
      }
    }

    function openLearnMore(style) {
      var config = assessments[viewingAssessmentKey || currentAssessment];
      var query = config.searchPrefix.replace('{style}', encodeURIComponent(style));
      var url = 'https://www.google.com/search?q=' + query;
      if (window.desktop && typeof window.desktop.openExternal === 'function') {
        window.desktop.openExternal(url); // desktop app: opens in the user's browser, via preload.js
      } else {
        window.open(url, '_blank', 'noopener');
      }
    }

    // ===== History =====
    function viewPastResults() {
      selectedTiles.clear();
      renderHistoryTiles();
      showScreen('history');
    }

    // focus: { index, part: 'main' | 'checkbox' } — which control to focus after re-rendering,
    // since the old one was just replaced. Only honoured for keyboard users.
    function renderHistoryTiles(focus) {
      var container = document.getElementById('history-tiles');
      var delSelBtn = document.getElementById('delete-selected-btn');
      delSelBtn.style.display = selectedTiles.size > 0 ? 'inline-block' : 'none';

      if (resultHistory.length === 0) {
        container.className = 'history-tiles';
        container.innerHTML = '<div class="history-empty">No past results yet.</div>';
        return;
      }

      var config = getConfig();
      container.className = 'history-tiles' + (selectedTiles.size > 0 ? ' select-mode' : '');
      var html = '';
      resultHistory.forEach(function(r, i) {
        var isSelected = selectedTiles.has(i);
        var attempt = resultHistory.length - i;
        html += '<div class="history-tile' + (isSelected ? ' tile-selected' : '') + '">';
        html += '<button type="button" class="tile-checkbox' + (isSelected ? ' checked' : '') + '" role="checkbox" aria-checked="' + isSelected + '"';
        html += ' aria-label="Select attempt #' + attempt + '" data-index="' + i + '" onclick="toggleTileSelect(event, ' + i + ')"></button>';
        html += '<button type="button" class="tile-main" data-index="' + i + '"';
        html += ' onclick="handleTileClick(event, ' + i + ')"';
        html += ' oncontextmenu="handleTileContext(event, ' + i + ')"';
        html += ' ontouchstart="handleTouchStart(event, ' + i + ')"';
        html += ' ontouchend="handleTouchEnd(event)"';
        html += ' ontouchmove="cancelLongPress()"';
        html += ' ontouchcancel="cancelLongPress()">';
        html += '<span class="tile-header">';
        html += '<span class="tile-attempt">Attempt #' + attempt + '</span>';
        html += '<span class="tile-date">' + esc(formatResultDate(r)) + '</span>';
        html += '</span>';
        html += '<span class="tile-primary">' + esc(r.primaries.join(' & ')) + '</span>';
        if (typeof r.overallScore === 'number') {
          html += '<span class="tile-overall">Overall: ' + r.overallScore + ' / ' + maxOverallScore(config) + '</span>';
        }
        html += '<span class="tile-scores">';
        Object.keys(r.scores).forEach(function(key) {
          html += '<span class="tile-score-chip">' + esc(key) + ': ' + esc(r.scores[key]) + '</span>';
        });
        html += '</span></button></div>';
      });
      container.innerHTML = html;

      if (lastInputWasKeyboard) {
        var target = null;
        if (focus) {
          var idx = Math.min(focus.index, resultHistory.length - 1);
          target = container.querySelector((focus.part === 'checkbox' ? '.tile-checkbox' : '.tile-main') + '[data-index="' + idx + '"]');
        }
        if (!target && (!document.activeElement || document.activeElement === document.body)) {
          target = document.querySelector('#history-screen [data-screen-focus]');
        }
        if (target) target.focus();
      }
    }

    function handleTileClick(e, idx) {
      if (longPressFired) return; // the finger lifting after a long-press — its menu is showing
      if (selectedTiles.size > 0) { toggleTileSelectByIdx(idx, 'main'); return; }
      cameFromHistory = true;
      showResults(resultHistory[idx]);
    }

    function toggleTileSelect(e, idx) {
      e.stopPropagation();
      toggleTileSelectByIdx(idx, 'checkbox');
    }

    function toggleTileSelectByIdx(idx, part) {
      if (selectedTiles.has(idx)) selectedTiles.delete(idx);
      else selectedTiles.add(idx);
      renderHistoryTiles({ index: idx, part: part || 'main' });
    }

    // ===== Context menu (right-click, long-press, or the keyboard's menu key / Shift+F10) =====
    var ctxTargetIdx = null;
    var ctxReturnFocus = null;

    function openContextMenu(idx, x, y, anchor) {
      ctxTargetIdx = idx;
      ctxReturnFocus = anchor || null;
      var menu = document.getElementById('context-menu');
      menu.classList.add('visible');

      // Opened from the keyboard there is no pointer position; anchor to the tile instead.
      if ((!x && !y) && anchor) {
        var rect = anchor.getBoundingClientRect();
        x = rect.left + 16;
        y = rect.top + rect.height / 2;
      }
      // Keep the whole menu on screen: open leftward/upward near the right/bottom edge.
      var margin = 8;
      var w = menu.offsetWidth;
      var h = menu.offsetHeight;
      if (x + w > window.innerWidth - margin) x -= w;
      if (y + h > window.innerHeight - margin) y -= h;
      x = Math.max(margin, Math.min(x, window.innerWidth - w - margin));
      y = Math.max(margin, Math.min(y, window.innerHeight - h - margin));
      menu.style.left = x + 'px';
      menu.style.top = y + 'px';

      menu.querySelector('.context-menu-item').focus();
    }

    function hideContextMenu() {
      document.getElementById('context-menu').classList.remove('visible');
      ctxTargetIdx = null;
    }

    function closeContextMenu(returnFocus) {
      var target = ctxReturnFocus;
      hideContextMenu();
      ctxReturnFocus = null;
      if (returnFocus && target && document.body.contains(target)) target.focus();
    }

    function isContextMenuOpen() {
      return document.getElementById('context-menu').classList.contains('visible');
    }

    function handleTileContext(e, idx) {
      e.preventDefault();
      openContextMenu(idx, e.clientX, e.clientY, e.currentTarget);
    }

    // Long-press opens the menu. The finger lifting afterwards would normally still produce a
    // click, which would close the menu and open the result underneath — so after a long-press
    // that click is cancelled (preventDefault on touchend) and, in case one arrives anyway,
    // ignored (longPressFired).
    var longPressTimer = null;
    var longPressFired = false;

    function handleTouchStart(e, idx) {
      cancelLongPress();
      longPressFired = false;
      var touch = e.touches[0];
      var x = touch.clientX;
      var y = touch.clientY;
      var anchor = e.currentTarget;
      longPressTimer = setTimeout(function () {
        longPressTimer = null;
        longPressFired = true;
        openContextMenu(idx, x, y, anchor);
      }, 500);
    }

    function cancelLongPress() {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    }

    function handleTouchEnd(e) {
      cancelLongPress();
      if (longPressFired) {
        e.preventDefault();
        setTimeout(function () { longPressFired = false; }, 400);
      }
    }

    function ctxSelect() {
      var idx = ctxTargetIdx;
      hideContextMenu();
      if (idx === null) return;
      selectedTiles.add(idx);
      renderHistoryTiles({ index: idx, part: 'main' });
    }

    function ctxDelete() {
      var idx = ctxTargetIdx;
      hideContextMenu();
      if (idx === null || !resultHistory[idx]) return;
      deleteResults([idx], 'Result deleted');
    }

    document.addEventListener('click', function(e) {
      if (longPressFired) return;
      if (!e.target.closest('.context-menu')) hideContextMenu();
    });

    // ===== Deleting =====
    function deleteResults(indices, message) {
      if (indices.length === 0) return;
      var key = currentAssessment;
      var snapshot = resultHistory.slice();
      var first = Math.min.apply(null, indices);
      indices.slice().sort(function (a, b) { return b - a; }).forEach(function (i) { resultHistory.splice(i, 1); });
      saveHistory();
      selectedTiles.clear();
      if (resultHistory.length === 0) backToAssessmentHome();
      else renderHistoryTiles({ index: first, part: 'main' });
      offerUndo(message, function () { restoreHistory(key, snapshot); });
    }

    function restoreHistory(key, snapshot) {
      try {
        localStorage.setItem(assessments[key].storageKey, JSON.stringify(snapshot));
      } catch (e) {
        announce("Couldn't restore: storage is unavailable.");
        return;
      }
      announce(snapshot.length === 1 ? 'Result restored.' : snapshot.length + ' results restored.');
      if (currentAssessment !== key) return;
      resultHistory = snapshot.slice();
      selectedTiles.clear();
      updateHomeBtn();
      var screen = getActiveScreen();
      if (screen === 'history' || screen === 'assessment-home') viewPastResults();
    }

    function deleteSelectedResults() {
      var n = selectedTiles.size;
      deleteResults(Array.from(selectedTiles), n === 1 ? '1 result deleted' : n + ' results deleted');
    }

    function deleteAllResults() {
      var n = resultHistory.length;
      deleteResults(resultHistory.map(function (_, i) { return i; }), n === 1 ? '1 result deleted' : 'All ' + n + ' results deleted');
    }

    // ===== Keyboard =====
    document.addEventListener('keydown', function(e) {
      // Ctrl+Z (Cmd+Z) undoes the last delete or discard while its toast is showing.
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'z' || e.key === 'Z') && pendingUndo) {
        e.preventDefault();
        runUndo();
        return;
      }

      if (isContextMenuOpen()) {
        var items = Array.from(document.querySelectorAll('#context-menu .context-menu-item'));
        var at = items.indexOf(document.activeElement);
        if (e.key === 'Escape') { e.preventDefault(); closeContextMenu(true); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); items[(at + 1) % items.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); items[(at - 1 + items.length) % items.length].focus(); }
        else if (e.key === 'Tab') { e.preventDefault(); closeContextMenu(true); }
        return;
      }

      if (getActiveScreen() !== 'quiz' || e.ctrlKey || e.metaKey || e.altKey) return;
      var total = getConfig().questions.length;
      if (/^[1-5]$/.test(e.key)) handleSelect(parseInt(e.key, 10));
      else if (e.key === 'ArrowLeft' && currentIdx > 0) goBack();
      else if (e.key === 'ArrowRight' && answers[currentIdx] !== null && currentIdx < total - 1) goNext();
      else if (e.key === 'Escape') cancelQuiz();
    });

    // ===== Back button (Android system back / browser back) =====
    // Exactly ONE extra history entry, the "guard", sits above the page's own entry. Pressing back
    // pops it; the app handles the press itself, then steps FORWARD onto that same guard entry.
    // Screen changes never add history entries, so the stack can't grow however long the app is
    // used. To exit, the app simply doesn't step forward: the second press within the exit window
    // then leaves the page, which closes an installed app.
    //
    // Why forward() and not pushState(): Chrome skips, on the next back press, any entry the page
    // added with no tap or keypress since the last navigation (its defence against pages that trap
    // the back button). A guard re-added by pushState inside the back handler got exactly that
    // treatment, so the second back press left the app from wherever it was (seen on Android
    // Chrome). Stepping forward reuses the existing entry and creates none. pushState is only used
    // right after a tap or key (armBackGuard) and once at load.
    var EXIT_WINDOW_MS = 2000;
    var exitPending = false;
    var exitTimer = null;
    var guardRestoreTimer = null;

    function onGuard() { return !!(history.state && history.state.guard); }

    function armBackGuard() {
      if (!onGuard()) history.pushState({ guard: true }, '');
    }

    // Step back onto the guard after a handled back press. If, unexpectedly, there is no guard
    // entry ahead to step onto, fall back to adding one.
    function restoreBackGuard() {
      clearTimeout(guardRestoreTimer);
      history.forward();
      guardRestoreTimer = setTimeout(function () {
        if (!onGuard() && !exitPending) armBackGuard();
      }, 400);
    }

    function cancelPendingExit() {
      if (!exitPending) return;
      exitPending = false;
      clearTimeout(exitTimer);
      document.getElementById('back-toast').classList.remove('visible');
      armBackGuard(); // reached from a tap or key (showScreen), so the user has just interacted
    }

    function startExitWindow() {
      exitPending = true;
      document.getElementById('back-toast').classList.add('visible');
      announce('Press back again to exit.');
      exitTimer = setTimeout(function () {
        exitPending = false;
        document.getElementById('back-toast').classList.remove('visible');
        restoreBackGuard();
      }, EXIT_WINDOW_MS);
    }

    function handleBackPress() {
      if (isContextMenuOpen()) {
        closeContextMenu(true);
      } else {
        var screen = getActiveScreen();
        if (screen === 'home') { startExitWindow(); return; } // no guard now: next press exits
        if (screen === 'assessment-home') showScreen('home');
        else if (screen === 'quiz') cancelQuiz();
        else if (screen === 'results') resultsGoBack();
        else if (screen === 'history') backToAssessmentHome();
      }
      restoreBackGuard();
    }

    (function initBackGuard() {
      if (onGuard()) return; // reloaded while on the guard: already in place
      var state = history.state;
      if (!(state && state.base)) history.replaceState({ base: true }, '');
      history.pushState({ guard: true }, '');
    })();

    window.addEventListener('popstate', function(e) {
      var state = e.state || {};
      if (state.guard) {
        // Arrived ON the guard: our own restoreBackGuard() step, or the forward button during
        // the exit window. Nothing to handle.
        clearTimeout(guardRestoreTimer);
        cancelPendingExit();
        return;
      }
      if (exitPending) {
        // Second press, but still on an entry of this page (e.g. one left behind by an older
        // version of the app): keep going back until the page is left.
        history.back();
        return;
      }
      handleBackPress();
    });

    // Offline support for the web app. Service workers need http(s); the desktop app loads from
    // a local file, where there is nothing to register.
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.warn('Offline support unavailable:', err);
      });
    }
  </script>
</body>
</html>
